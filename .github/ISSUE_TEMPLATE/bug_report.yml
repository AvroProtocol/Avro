name: Bug report
description: Report a reproducible AVYRO issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not use this form for security vulnerabilities. See SECURITY.md instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web
        - Desktop
        - Android
        - Backend
        - SDK
        - Contracts
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser or app version, network, and any relevant tool versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, private keys, and personal information before posting.
