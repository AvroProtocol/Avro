name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the APK to (for example v0.1.15)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build and Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Mobile Dependencies
        working-directory: ./android
        run: bun install --frozen-lockfile

      - name: Run Expo Prebuild
        working-directory: ./android
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        working-directory: ./android/android
        run: ./gradlew assembleRelease

      - name: Locate and Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/android/app/build/outputs/apk/release/app-release.apk build-artifacts/avyro-mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avyro-mobile-apk
          path: build-artifacts/avyro-mobile.apk
          if-no-files-found: error

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Manual runs that publish an APK require a release_tag such as v0.1.15." >&2
            exit 1
          fi

          if [[ "$TAG" != v* ]]; then
            echo "release_tag must start with v" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: build-artifacts/avyro-mobile.apk
          tag_name: ${{ steps.release.outputs.tag }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
